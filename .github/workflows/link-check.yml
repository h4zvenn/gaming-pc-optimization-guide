name: Link Check


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:


permissions:
  contents: read


jobs:
  link-check:
    name: Check built site links
    runs-on: ubuntu-latest
    timeout-minutes: 15


    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true


      - name: Build Jekyll site
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production


      - name: Prepare site for root-relative links
        run: |
          mkdir -p site-check/gaming-pc-optimization-guide
          cp -a _site/. site-check/gaming-pc-optimization-guide/


      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          format: markdown
          args: >-
            --no-progress
            --verbose
            --offline
            --root-dir ./site-check
            --index-files index.html
            --remap "^https://h4zvenn\\.github\\.io/gaming-pc-optimization-guide/ file://${{ github.workspace }}/site-check/gaming-pc-optimization-guide/"
            --max-concurrency 4
            './site-check/gaming-pc-optimization-guide/**/*.html'


      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-check-report
          path: lychee/out.md
          if-no-files-found: ignore
