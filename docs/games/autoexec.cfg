// ---------- ПРОИЗВОДИТЕЛЬНОСТЬ & ДВИЖОК ----------
fps_max "0"
r_fullscreen_gamma "2.2"
cl_autohelp "0"                             // Отключение подсказок на экране

// ---------- МЫШЬ ----------
sensitivity "0.6"
zoom_sensitivity_ratio "1.0"

// ---------- ПРИЦЕЛ (Ваш сохраненный код) ----------
apply_crosshair_code "CSGprK6vqmkcUc7oZSNiHbOoBXtPj6izicR8ymb5UQHzyD"

// ---------- HUD & ИНТЕРФЕЙС ----------
hud_scaling "0.85"
cl_hud_color "8"
cl_teamcounter_playercount_instead_of_avatars "1"

// ---------- РАДАР (Обзор всей карты как у m0NESY/s1mple) ----------
cl_radar_always_centered "0"
cl_radar_rotate "1"
cl_radar_scale "0.30"                       // Карта стала меньше, видно все точки
cl_hud_radar_scale "1.10"
cl_radar_icon_scale_min "0.5"
cl_radar_square_with_scoreboard "1"

// ---------- VIEWMODEL (Руки) ----------
viewmodel_presetpos "0"
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "0"
viewmodel_offset_z "-1.5"

// ---------- ЗВУК ----------
snd_menumusic_volume "0"
snd_roundstart_volume "0"
snd_roundaction_volume "0"
snd_roundend_volume "0"
snd_mapobjective_volume "0"
snd_tensecondwarning_volume "0.05"          // 10-секундный таймер бомбы/раунда
snd_deathcamera_volume "0"
snd_mvp_volume "0.05"

// ---------- ДВИЖЕНИЕ ----------
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"

// ---------- ГРАНАТЫ (Чистые слоты CS2) ----------
bind "z" "slot8"                            // Дым (Smoke)
bind "x" "slot6"                            // Осколочная (HE Grenade)
bind "c" "slot7"                            // Флешка (Flashbang)
bind "v" "slot10"                           // Молотов (Molotov / Incendiary)

// ---------- СВЯЗЬ ----------
bind "MOUSE4" "+voicerecord"

// ---------- АВТОБАЙ (F1-F8) ----------
bind "F1" "buy vesthelm; buy defuser"
bind "F2" "buy ak47; buy m4a1_silencer"
bind "F3" "buy awp"
bind "F4" "buy flashbang; buy flashbang; buy smokegrenade"
bind "F5" "buy hegrenade; buy molotov; buy incgrenade"
bind "F6" "buy m4a1"
bind "F7" "buy tec9; buy fiveseven"
bind "F8" "buy deagle"

// ========================================
host_writeconfig
echo "CS2 PRO AUTOEXEC LOADED SUCCESSFULLY"